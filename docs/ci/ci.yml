name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  data:
    name: Validate data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Changed records (strict contribution bar)
        id: changed
        run: |
          base="${{ github.event.pull_request.base.sha || 'HEAD~1' }}"
          files=$(git diff --name-only --diff-filter=AM "$base"...HEAD -- 'data/aesthetics/*.json' | xargs -r -n1 basename | tr '\n' ' ')
          echo "files=$files" >> "$GITHUB_OUTPUT"
      - name: Validate schema, integrity and quality
        run: node scripts/data/validate.ts ${{ steps.changed.outputs.files && format('--strict {0}', steps.changed.outputs.files) || '' }}
      - name: Build data bundles (JSON, CSV, Parquet, DuckDB)
        run: node scripts/data/build.ts

  app:
    name: Typecheck, lint and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
